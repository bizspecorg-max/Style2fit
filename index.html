<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Style2Fit · Digital Tailor Management System</title>
    <meta name="title" content="Style2Fit – Tailor OS for Modern Fashion Businesses" />
    <meta name="description" content="Style2Fit helps tailors and fashion designers manage customers, styles, measurements, and orders – all in one place. Replace paper measurement books with a digital workflow." />
    <meta name="keywords" content="tailor management, style measurement, fashion design software, measurement book, fashion business, African tailor, Style2Fit" />
    <meta name="author" content="Style2Fit" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <!-- Link previews (WhatsApp, Facebook, X, iMessage) need absolute URLs on the live site -->
    <meta property="og:url" content="https://style2fit.vercel.app/" />
    <meta property="og:title" content="Style2Fit – Every measurement. Every order. Beautifully kept." />
    <meta property="og:description" content="Customers, measurements, styles and orders for tailors and fashion houses — on any phone. 14 days free." />
    <meta property="og:image" content="https://style2fit.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Style2Fit logo — Every measurement. Every order. Beautifully kept." />
    <meta property="og:site_name" content="Style2Fit" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://style2fit.vercel.app/" />
    <meta name="twitter:title" content="Style2Fit – Every measurement. Every order. Beautifully kept." />
    <meta name="twitter:description" content="Customers, measurements, styles and orders for tailors and fashion houses — on any phone." />
    <meta name="twitter:image" content="https://style2fit.vercel.app/og-image.png" />

    <!-- Icons: vector favicon with PNG fallbacks; manifest for "Add to Home Screen" -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#114b36" />

    <!-- Connect early to the servers every screen needs -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the page (text shows immediately, then swaps) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" /></noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
